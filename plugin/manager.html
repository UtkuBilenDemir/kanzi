        const colourDefs = [
          { name: 'yellow', codes: 'y, yellow', hex: '#ffd400' },
          { name: 'orange', codes: 'o, orange', hex: '#ff8c00' },
          { name: 'red', codes: 'r, red', hex: '#ff6666' },
          { name: 'grey', codes: 'e, grey, gray', hex: '#8a8a8a' },
          { name: 'green', codes: 'g, green', hex: '#5fb236' },
          { name: 'blue', codes: 'b, blue, bl', hex: '#2ea8e5' },
          { name: 'purple', codes: 'p, purple', hex: '#a28ae5' },
          { name: 'magenta', codes: 'm, magenta, pink', hex: '#e56eee' },
        ];
        const colourDefaults = {};
        for (const d of colourDefs) for (const c of d.codes.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean)) colourDefaults[c] = d.hex;
        const currentMap = this.settings.colourMap || this.settings.colorMap || colourDefaults;
        // group currentMap by hex for display (one bar per colour)
        const byHex = {};
        for (const [k,v] of Object.entries(currentMap)) {

          byHex[hv].push(k);
        }
        // ensure all default hexes have an entry

        this.plugin.loadColourMap().then(m => {
          if (m && JSON.stringify(m) !== JSON.stringify(currentMap)) {
            this.settings.colourMap = m;
          }
        }).catch(()=>{});
        for (const def of colourDefs) {

          const tdHex = document.createElement('td');
          const inpHex = document.createElement('input');
          inpHex.type = 'color';
          inpHex.value = hx;
          // try to use currentMap's hex if user changed it
          const actualHex = (byHex[hx] ? hx : def.hex);
          // if user changed hex for this colour, use that
          let displayHex = def.hex;
          // find if any of the codes in this row has a different hex in currentMap (custom)
          // For now just use def.hex, but if currentMap has different, it will be in byHex key
          // So displayHex is hx
          displayHex = hx;
          inpHex.value = displayHex;
          inpHex.style.height = '28px';
          inpHex.style.padding = '2px';
          inpHex.dataset.colourHex = hx;
          inpHex.className = 'colour-hex-input';
          const txtHex = document.createElement('input');
          txtHex.value = displayHex;
          txtHex.style.fontFamily = 'JetBrains Mono, monospace';
          txtHex.style.fontSize = '11px';
          txtHex.style.marginLeft = '6px';
          txtHex.style.width = '80px';
          txtHex.dataset.colourHexTxt = hx;
          inpHex.addEventListener('input', () => { txtHex.value = inpHex.value; });
          txtHex.addEventListener('input', () => { if (/^#[0-9a-fA-F]{6}$/.test(txtHex.value)) inpHex.value = txtHex.value; });
          tdHex.appendChild(inpHex);
          tdHex.appendChild(txtHex);
          tr.appendChild(tdHex);
          const tdPrev = document.createElement('td');
          const sw = document.createElement('span');
          sw.style.display = 'inline-block';
          sw.style.width = '20px';
          sw.style.height = '12px';
          sw.style.borderRadius = '2px';
          sw.style.border = '1px solid var(--line)';
          sw.style.background = displayHex;
          inpHex.addEventListener('input', () => sw.style.background = inpHex.value);
          txtHex.addEventListener('input', () => { if (/^#[0-9a-fA-F]{6}$/.test(txtHex.value)) sw.style.background = txtHex.value; });
          tdPrev.appendChild(sw);
          tr.appendChild(tdPrev);
          cTbody.appendChild(tr);
        }
        // also add any custom hexes not in defaults (user added new colour)
        for (const [hx, codes] of Object.entries(byHex)) {
          if (colourDefs.some(d => d.hex.toLowerCase() === hx)) continue;
          const tr = document.createElement('tr');
          const tdCode = document.createElement('td');
          const inpCode = document.createElement('input');
          inpCode.value = codes.join(', ');
          inpCode.className = 'colour-key-input';
          inpCode.dataset.colourCodes = hx;
          inpCode.style.fontFamily = 'JetBrains Mono, monospace';
          tdCode.appendChild(inpCode);
          tr.appendChild(tdCode);
          const tdHex = document.createElement('td');
          const inpHex = document.createElement('input');
          inpHex.type = 'color';
          inpHex.value = hx;
          inpHex.className = 'colour-hex-input';
          inpHex.dataset.colourHex = hx;
          tdHex.appendChild(inpHex);
          const txtHex = document.createElement('input');
          txtHex.value = hx;
          tdHex.appendChild(txtHex);
          tr.appendChild(tdHex);
          const tdPrev = document.createElement('td');
          const sw = document.createElement('span');
          sw.style.background = hx;
          tdPrev.appendChild(sw);
          tr.appendChild(tdPrev);
          cTbody.appendChild(tr);
        }
        // Add row button
        const addRow = document.createElement('button');
        addRow.textContent = '+ Add mapping';
        addRow.style.marginTop = '6px';
        addRow.style.padding = '4px 8px';
        addRow.style.border = '1px solid var(--line)';
        addRow.style.background = 'var(--panel)';
        addRow.style.borderRadius = 'var(--radius)';
        addRow.style.cursor = 'pointer';
        addRow.style.fontSize = '11px';
        addRow.addEventListener('click', () => {
          const tr = document.createElement('tr');
          const tdCode = document.createElement('td');
          const inpCode = document.createElement('input');
          inpCode.placeholder = 'e.g. teal';
          inpCode.style.fontFamily = 'JetBrains Mono, monospace';
          inpCode.className = 'colour-key-input';
          tdCode.appendChild(inpCode);
          tr.appendChild(tdCode);
          const tdHex = document.createElement('td');
          const inpHex = document.createElement('input');
          inpHex.type = 'color';
          inpHex.value = '#ffd400';
          inpHex.className = 'colour-hex-input';
          const txtHex = document.createElement('input');
          txtHex.value = '#ffd400';
          txtHex.style.fontFamily = 'JetBrains Mono, monospace';
          txtHex.style.fontSize = '11px';
          txtHex.style.marginLeft = '6px';
          txtHex.style.width = '80px';
          tdHex.appendChild(inpHex);
          tdHex.appendChild(txtHex);
          tr.appendChild(tdHex);
          const tdPrev = document.createElement('td');
          const sw = document.createElement('span');
          sw.style.display = 'inline-block';
          sw.style.width = '20px';
          sw.style.height = '12px';
          sw.style.border = '1px solid var(--line)';
          sw.style.background = '#ffd400';
          tdPrev.appendChild(sw);
          tr.appendChild(tdPrev);
          cTbody.appendChild(tr);
        });
        colourSection.appendChild(addRow);
        const resetBtn = document.createElement('button');
        resetBtn.textContent = 'Reset to defaults';
        resetBtn.style.marginLeft = '6px';
        resetBtn.style.padding = '4px 8px';
        resetBtn.style.border = '1px solid var(--line)';
        resetBtn.style.background = 'var(--panel)';
        resetBtn.style.borderRadius = 'var(--radius)';
        resetBtn.style.cursor = 'pointer';
        resetBtn.style.fontSize = '11px';
        resetBtn.addEventListener('click', async () => {
          if (!confirm('Reset colours to defaults (grey = [e], red = [r])?')) return;
          cTbody.textContent = '';
          for (const k of Object.keys(colourDefaults).sort()) {
            const tr = document.createElement('tr');
            const tdCode = document.createElement('td');
            const inpCode = document.createElement('input');
            inpCode.value = k;
            inpCode.className = 'colour-key-input';
            tdCode.appendChild(inpCode);
            tr.appendChild(tdCode);
            const tdHex = document.createElement('td');
            const inpHex = document.createElement('input');
            inpHex.type = 'color';
            inpHex.value = colourDefaults[k];
            inpHex.className = 'colour-hex-input';
            const txtHex = document.createElement('input');
            txtHex.value = colourDefaults[k];
            tdHex.appendChild(inpHex);
            tdHex.appendChild(txtHex);
            tr.appendChild(tdHex);
            const tdPrev = document.createElement('td');
            const sw = document.createElement('span');
            sw.style.display = 'inline-block';
            sw.style.width = '20px';
            sw.style.height = '12px';
            sw.style.background = colourDefaults[k];
            tdPrev.appendChild(sw);
            tr.appendChild(tdPrev);
            cTbody.appendChild(tr);
          }
        });
        colourSection.appendChild(resetBtn);
        sForm.appendChild(colourSection);

        const sSaveBtn = document.createElement('button');
        sSaveBtn.textContent = 'Save Settings';
        sSaveBtn.style.marginTop = '12px';
        sSaveBtn.style.padding = '8px 14px';
        sSaveBtn.style.border = '1px solid var(--accent)';
        sSaveBtn.style.background = 'var(--accent)';
        sSaveBtn.style.color = 'white';
        sSaveBtn.style.cursor = 'pointer';
        sSaveBtn.style.fontFamily = 'inherit';
        sSaveBtn.style.borderRadius = 'var(--radius)';
        sSaveBtn.style.fontWeight = '600';
        sSaveBtn.addEventListener('click', () => this.saveSettings());
        sForm.appendChild(sSaveBtn);
        const sNotice = document.createElement('div');
        sNotice.className = 'notice';
        sNotice.style.marginTop = '12px';
        sNotice.textContent = 'Saves to prefs and plugin-config.json in the project directory. No restart required.';
        sForm.appendChild(sNotice);
        settingsTab.appendChild(sForm);
        root.appendChild(settingsTab);

        const artifactsTab = document.createElement('div');
        artifactsTab.id = 'tab-artifacts';
        artifactsTab.className = 'tab';
        const aH2 = document.createElement('h2');
        aH2.textContent = 'Artifacts';
        artifactsTab.appendChild(aH2);
        const aDesc = document.createElement('div');
        aDesc.className = 'muted';
        aDesc.textContent = 'Generated files from the last pipeline run. Open to view, Reveal to show in Finder.';
        artifactsTab.appendChild(aDesc);
        const artifacts = [
          ['Mismatch review', 'docs/mismatch-review.md'],
          ['Persistent overrides', 'match-overrides.json'],
          ['Generated suggestions', 'match-overrides.generated.json'],
          ['Positioned plan', 'import-plan.positioned.json'],
          ['Final writer plan', 'import-plan.final.json'],
          ['Plugin summary', 'plugin-summary.json'],
        ];
        for (const [label, rel] of artifacts) {
          const row = document.createElement('div');
          row.style.display = 'flex';
          row.style.justifyContent = 'space-between';
          row.style.alignItems = 'center';
          row.style.border = '1px solid var(--line)';
          row.style.padding = '8px 12px';
          row.style.margin = '6px 0';
          row.style.background = 'var(--panel)';
          row.style.borderRadius = 'var(--radius)';
          row.style.boxShadow = 'var(--shadow)';
          const left = document.createElement('div');
          left.style.fontFamily = "'iA Writer Duo', ui-monospace, monospace";
          left.style.fontSize = '12px';
          left.textContent = `${label}: ${this.plugin.artifactPath(rel)}`;
          row.appendChild(left);
          const right = document.createElement('div');
          right.style.display = 'flex';
          right.style.gap = '4px';
          const openBtn = document.createElement('button');
          openBtn.textContent = 'Open';
          openBtn.style.padding = '4px 10px';
          openBtn.style.border = '1px solid var(--line)';
          openBtn.style.background = 'var(--panel)';
          openBtn.style.cursor = 'pointer';
          openBtn.style.fontFamily = 'inherit';
          openBtn.style.borderRadius = 'var(--radius)';
          openBtn.style.fontSize = '12px';
          openBtn.addEventListener('click', () => this.plugin.openArtifact(rel));
          right.appendChild(openBtn);
          const revealBtn = document.createElement('button');
          revealBtn.textContent = 'Reveal';
          revealBtn.style.padding = '4px 10px';
          revealBtn.style.border = '1px solid var(--accent)';
          revealBtn.style.background = 'var(--accent)';
          revealBtn.style.color = 'white';
          revealBtn.style.cursor = 'pointer';
          revealBtn.style.fontFamily = 'inherit';
          revealBtn.style.borderRadius = 'var(--radius)';
          revealBtn.style.fontSize = '12px';
          revealBtn.style.fontWeight = '600';
          revealBtn.addEventListener('click', () => this.plugin.revealFile(this.plugin.artifactPath(rel)));
          right.appendChild(revealBtn);
          row.appendChild(right);
          artifactsTab.appendChild(row);
        }
        root.appendChild(artifactsTab);

        const statusDiv = document.createElement('div');
        statusDiv.id = 'status';
        statusDiv.className = 'notice';
        statusDiv.style.display = 'none';
        statusDiv.style.marginTop = '16px';
        statusDiv.style.borderLeft = '4px solid var(--accent)';
        statusDiv.style.background = 'var(--panel-soft)';
        root.appendChild(statusDiv);

        this.refreshRows();
        this.refreshTitleOverview();
        this.refreshIntegrated();
        this.refreshMappings();
        this.updateInfobox();
        this.makeTableResizable(document.querySelector('#title-status-table'));
        this.makeTableResizable(document.querySelector('#tab-conflicts table'));
        this.makeTableResizable(document.querySelector('#tab-integrated table'));
        this.makeTableResizable(document.querySelector('#tab-mappings table'));
        this.makeTableSortable(document.querySelector('#title-status-table'), {
          tableKey: 'titles',
          columns: ['status', 'source', 'integrated', 'pending', 'problems', 'title', 'target'],
          descendingColumns: ['source', 'integrated', 'pending', 'problems'],
          refresh: () => this.refreshTitleOverview(),
        });
        this.makeTableSortable(document.querySelector('#tab-conflicts table'), {
          tableKey: 'conflicts',
          columns: [null, 'status', 'count', 'title', 'detail', null],
          skipColumns: [0, 5],
          descendingColumns: ['count'],
          refresh: () => { this.conflictsPage = 0; this.refreshRows(); },
        });
        this.makeTableSortable(document.querySelector('#tab-integrated table'), {
          tableKey: 'integrated',
          columns: ['title', 'citation', 'text', 'added', 'integrated', 'page'],
          descendingColumns: ['added', 'integrated'],
          refresh: () => { this.integratedPage = 0; this.refreshIntegrated(); },
        });
        this.makeTableSortable(document.querySelector('#tab-mappings table'), {
          tableKey: 'mappings',
          columns: ['title', 'resolution', 'status', 'count', 'updated', null],
          skipColumns: [5],
          descendingColumns: ['count', 'updated'],
          refresh: () => { this.mappingsPage = 0; this.refreshMappings(); },
        });
      },

      toggleTitle(title) {
        this.expandedTitles[title] = !this.expandedTitles[title];
        this.refreshRows();
      },

      refreshRows(resetPage = false) {
        const tbody = document.getElementById('rows');
        if (!tbody) return;
        tbody.textContent = '';
        const needle = (document.getElementById('search')?.value || '').toLowerCase();
        const filtered = this.rows.filter(row => `${(row.statuses || [row.status]).join(' ')} ${(row.sources || []).join(' ')} ${row.title} ${row.detail || ''} ${(row.candidates || []).map(c => `${c.citation_key} ${c.title}`).join(' ')} ${(row.clippings || []).map(c => c.text).join(' ').slice(0, 4000)}`.toLowerCase().includes(needle));
        const sorted = this.sortRows(filtered, 'conflicts', {
          status: row => row.status || '',
          count: row => this.conflictAffected(row).failed,
          title: row => row.title || '',
          detail: row => `${row.candidates?.[0]?.citation_key || row.candidates?.[0]?.key || ''} ${row.detail || ''}`,
        });
        if (resetPage) this.conflictsPage = 0;
        const page = this.paginate(sorted, 'conflictsPage', 'conflictsPageSize');
        this.refreshPagination('conflicts-pagination', 'conflictsPage', 'conflictsPageSize', page.totalPages, () => this.refreshRows());
        const countNote = document.getElementById('conflicts-count');
        if (countNote) countNote.textContent = `${filtered.length} unique titles — page ${this.conflictsPage + 1}/${page.totalPages}`;
        if (!filtered.length) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = 6;
          td.textContent = 'No conflicts match the filter.';
          tr.appendChild(td);
          tbody.appendChild(tr);
          return;
        }
        for (let idx = 0; idx < page.rows.length; idx++) {
          const row = page.rows[idx];
          const globalIndex = this.rows.indexOf(row);
          const expanded = !!this.expandedTitles[row.title];
          const tr = document.createElement('tr');
          // Chevron cell
          const tdExp = document.createElement('td');
          tdExp.dataset.sortValue = '';
          const clipCount = (row.clippings || []).length;
          if (clipCount) {
            const btn = document.createElement('button');
            btn.className = 'expander';
            btn.textContent = expanded ? '▾' : '▸';
            btn.title = expanded ? `Hide ${clipCount} source clipping(s)` : `Show ${clipCount} source clipping(s)`;
            btn.addEventListener('click', () => this.toggleTitle(row.title));
            tdExp.appendChild(btn);
          } else {
            tdExp.textContent = '';
            tdExp.style.color = 'var(--faint)';
          }
          tr.appendChild(tdExp);
          const tdStatus = document.createElement('td');
          tdStatus.dataset.sortValue = row.status || '';
          const stack = document.createElement('div');
          stack.className = 'status-stack';
          for (const s of (row.statuses || [row.status])) {
            const pill = document.createElement('span');
            pill.className = 'pill';
            pill.textContent = s;
            pill.title = `Sources: ${(row.sources || []).join(', ')}`;
            stack.appendChild(pill);
          }
          tdStatus.appendChild(stack);
          tr.appendChild(tdStatus);
          const tdCount = document.createElement('td');
          const affected = this.conflictAffected(row);
          tdCount.textContent = affected.failed === affected.total
            ? String(affected.total)
            : `${affected.failed} / ${affected.total}`;
          tdCount.title = `${affected.failed} with problems out of ${affected.total} source clipping(s)`;
          tdCount.dataset.sortValue = String(affected.failed).padStart(8, '0');
          tr.appendChild(tdCount);
          const tdTitle = document.createElement('td');
          tdTitle.textContent = row.title;
          const affectedTitle = this.conflictAffected(row);
          tdTitle.title = `${row.title}\nSources: ${(row.sources || []).join(', ')}\n${affectedTitle.failed} with problems / ${affectedTitle.total} source clipping(s) — click ▸ to expand`;
          tdTitle.dataset.sortValue = row.title;
          tr.appendChild(tdTitle);
          const tdDetail = document.createElement('td');
          if (row.candidates && row.candidates.length) {
            const top = row.candidates[0];
            const cite = top.citation_key || top.key || top.item_id || '';
            tdDetail.textContent = `${row.candidates.length} suggestion(s) — top: ${cite} (${top.score ? Math.round(top.score*100)+'%' : '—'})${row.detail ? ' · ' + row.detail : ''}`;
            tdDetail.title = row.candidates.slice(0,4).map(c=> `${c.citation_key||c.key}: ${c.title}`).join('\n') + (row.detail ? '\n\nPosition: ' + row.detail : '');
          } else if (row.mappedTarget) {
            tdDetail.textContent = `Mapped to ${row.mappedTarget}${row.detail ? ' · ' + row.detail : ''}`;
            tdDetail.title = `Title already maps to ${row.mappedTarget} (match status: ${row.matchStatusFull || 'n/a'}). These clips need positioning, not a new mapping.${row.detail ? '\n\nPosition: ' + row.detail : ''}`;
          } else if (row.detail) {
            tdDetail.textContent = row.detail;
          } else {
            tdDetail.textContent = 'No candidates';
          }
          tdDetail.style.fontSize='11px';
          tdDetail.style.color='#444';
          tr.appendChild(tdDetail);
          const tdActions = document.createElement('td');
          tdActions.className = 'row-actions';
          tdActions.style.minWidth='260px';
          if (row.candidates && row.candidates.length) {
            const list = document.createElement('div');
            list.className = 'candidate-list';
            for (let i=0;i<row.candidates.length;i++) {
              const c = row.candidates[i];
              const opt = document.createElement('div');
              opt.className = 'candidate-option';
              const span = document.createElement('span');
              span.textContent = `${c.citation_key || c.key || c.item_id} · ${c.title || ''} ${c.score ? `(${Math.round(c.score*100)}%)` : ''}`;
              span.title = `${c.citation_key || c.key || c.item_id}: ${c.title || ''} — ${c.reason || ''}`;
              const btn = document.createElement('button');
              btn.textContent = 'Use';
              btn.title = `Use ${c.citation_key || c.key}`;
              btn.addEventListener('click', () => this.saveCandidateAt(globalIndex, i));
              opt.appendChild(span);
              opt.appendChild(btn);
              list.appendChild(opt);
            }
            tdActions.appendChild(list);
          } else if (row.mappedTarget) {
            const mapped = document.createElement('div');
            mapped.className='muted';
            mapped.style.fontSize='11px';
            const noAttach = (row.statuses || []).includes('matched-title-no-attachment');
            mapped.textContent = noAttach
              ? `Already mapped to ${row.mappedTarget} — attach a PDF/EPUB to it in Zotero, then Retry. Remap below only if the target is wrong.`
              : `Already mapped to ${row.mappedTarget} — fix the attachment/position issue, then Retry. Remap below only if the target is wrong.`;
            tdActions.appendChild(mapped);
          } else {
            const noCand = document.createElement('div');
            noCand.className='muted';
            noCand.style.fontSize='11px';
            noCand.textContent='No suggestions — enter custom key below.';
            tdActions.appendChild(noCand);
          }
          const manualRow = document.createElement('div');
          manualRow.className='manual-row';
          const manualInput = document.createElement('input');
          manualInput.id=`manual-${globalIndex}`;
          manualInput.placeholder = row.mappedTarget ? 'remap to a different key…' : 'or enter any citekey / Zotero key / ID';
          manualInput.title='Examples: deleuze1987  |  JTDWDKRH  |  51395';
          manualRow.appendChild(manualInput);
          const btnManual = document.createElement('button');
          btnManual.textContent='Use Custom';
          btnManual.className='row-btn';
          btnManual.addEventListener('click', () => this.saveManualCandidate(globalIndex));
          manualRow.appendChild(btnManual);
          tdActions.appendChild(manualRow);
          const btnIgnore = document.createElement('button');
          btnIgnore.textContent = 'Ignore Title';
          btnIgnore.className = 'row-btn';
          btnIgnore.style.marginTop='6px';
          btnIgnore.addEventListener('click', () => this.ignore(globalIndex));
          tdActions.appendChild(btnIgnore);
          tr.appendChild(tdActions);
          tbody.appendChild(tr);
          // Expandable detail row with per-highlight text
          if (expanded && clipCount) {
            const dtr = document.createElement('tr');
            dtr.className = 'detail-row';
            const dtd = document.createElement('td');
            dtd.colSpan = 6;
            const list = document.createElement('div');
            list.className = 'clip-list';
            const head = document.createElement('div');
            head.className = 'muted';
            const affectedHead = this.conflictAffected(row);
            head.textContent = affectedHead.failed === affectedHead.total
              ? `${affectedHead.total} source clipping(s) for this title:`
              : `${affectedHead.failed} with problems / ${affectedHead.total} source clipping(s) for this title:`;
            list.appendChild(head);
            const affectedClips = (row.clippings || []).filter(c =>
              (c.problems && c.problems.length) || (c.status && c.status !== '' && c.status !== 'positioned')
            );
            const showAll = !affectedClips.length || affectedClips.length === (row.clippings || []).length;
            const clipsToShow = showAll ? (row.clippings || []) : affectedClips;
            for (const clip of clipsToShow.slice(0, 60)) {
              const item = document.createElement('div');
              item.className = 'clip-item';
              const chead = document.createElement('div');
              chead.className = 'clip-head';
              const bits = [];
              if (clip.kind) bits.push(clip.kind);
              if (clip.page) bits.push('p. ' + clip.page);
              if (clip.location) bits.push('loc. ' + clip.location);
              if (clip.status && clip.status !== row.status) bits.push(clip.status);
              chead.textContent = bits.join(' · ') || clip.status || 'highlight';
              item.appendChild(chead);
              const ctext = document.createElement('div');
              ctext.className = 'clip-text';
              let t = clip.text || '(no text)';
              if (t.length > 420) t = t.slice(0, 420) + '…';
              ctext.textContent = t;
              item.appendChild(ctext);
              if (clip.problems && clip.problems.length) {
                const prob = document.createElement('div');
                prob.className = 'clip-problem';
                prob.textContent = clip.problems.join('; ');
                item.appendChild(prob);
              }
              if (clip.pageHint?.text) {
                const hint = document.createElement('div');
                hint.className = 'clip-problem';
                hint.style.color = 'var(--muted)';
                hint.style.whiteSpace = 'pre-wrap';
                let ht = clip.pageHint.text;
                if (ht.length > 900) ht = ht.slice(0, 900) + '…';
                hint.textContent = `Near Kindle p.${clip.pageHint.kindle_page} the PDF reads:\n${ht}`;
                hint.title = 'Extracted PDF text around the Kindle page hint — find the passage and place the highlight manually in Zotero, or Copy text above.';
                item.appendChild(hint);
              }
              if (clip.id) {
                const actions = document.createElement('div');
                actions.style.display = 'flex';
                actions.style.gap = '6px';
                actions.style.marginTop = '6px';
                const copyBtn = document.createElement('button');
                copyBtn.textContent = 'Copy text';
                copyBtn.className = 'row-btn';
                copyBtn.title = 'Copy this clipping text for manual insertion in Zotero';
                copyBtn.addEventListener('click', (ev) => { ev.stopPropagation(); this.copyClipText(clip); });
                actions.appendChild(copyBtn);
                const discardBtn = document.createElement('button');
                discardBtn.textContent = 'Discard';
                discardBtn.className = 'row-btn';
                discardBtn.title = 'Permanently discard this clipping — it will not be retried or shown again';
                discardBtn.addEventListener('click', (ev) => { ev.stopPropagation(); this.discardClip(clip.id, row.title); });
                actions.appendChild(discardBtn);
                item.appendChild(actions);
              }
              list.appendChild(item);
            }
            if (clipsToShow.length > 60) {
              const more = document.createElement('div');
              more.className = 'muted';
              more.textContent = `… and ${clipsToShow.length - 60} more with problems. The rest are integrated — see Integrated tab.`;
              list.appendChild(more);
            } else if (!showAll) {
              const note = document.createElement('div');
              note.className = 'muted';
              note.textContent = `Showing only the ${clipsToShow.length} with problems. The other ${row.clippings.length - clipsToShow.length} for this title are integrated — see Integrated tab.`;
              list.appendChild(note);
            }
            dtd.appendChild(list);
            dtr.appendChild(dtd);
            tbody.appendChild(dtr);
          }
        }
      },
    };
  </script>
</head>
<body onload="KindleManager.initSafe()">
  <div id="root">Loading Kanzi...</div>
</body>
</html>
